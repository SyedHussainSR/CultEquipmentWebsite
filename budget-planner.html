<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Equipment Planner | cult equipment</title>
    <meta
      name="description"
      content="Plan a commercial gym equipment mix by budget and square feet using cult equipment cardio and strength pricing."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260730-1" />
  </head>
  <body class="planner-page">
    <div class="page-shell">
      <header class="site-header is-scrolled" data-header>
        <a class="brand" href="index.html" aria-label="cult equipment">
          <img src="assets/cult-equipment-logo.png" alt="cult equipment" />
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" data-nav-toggle aria-label="Open navigation menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav class="nav-links" id="site-navigation" aria-label="Primary navigation" data-nav-menu>
          <a class="nav-link nav-link-collections" href="index.html#collections">Collections</a>
          <a class="nav-link nav-link-packages" href="index.html#packages">Packages</a>
          <a class="nav-link nav-link-projects" href="index.html#owners">Projects</a>
          <a class="nav-link nav-link-catalog" href="catalog.html">Catalog</a>
          <a class="nav-link nav-link-planner" href="budget-planner.html" aria-current="page">Equipment Planner</a>
          <a class="nav-link nav-link-layout" href="layout-planner.html">Layout Planner</a>
        </nav>
        <a class="nav-cta" href="index.html#lead-form-wrap">Request a call</a>
      </header>

      <main class="planner-main">
        <section class="planner-hero">
          <div>
            <p class="consult-intro">Equipment Planner</p>
            <h1>Build a gym equipment plan from your budget.</h1>
          </div>
          <form class="planner-card" id="budget-planner-form">
            <label>
              <span>Total Budget</span>
              <input id="planner-budget" name="budget" type="number" min="50000" step="10000" placeholder="Example: 1500000" required />
            </label>
            <label>
              <span>Available Square Feet</span>
              <input id="planner-sqft" name="sqft" type="number" min="100" step="50" placeholder="Example: 1200" required />
            </label>
            <button class="button primary" type="submit">Create Plan</button>
          </form>
        </section>

        <section class="planner-output" id="planner-output" hidden>
          <div class="planner-output-head">
            <div>
              <p class="consult-intro">Recommended Mix</p>
              <h2 id="planner-title">Equipment plan</h2>
            </div>
            <button class="button primary" id="planner-add-quote" type="button">Add Plan To Quote</button>
          </div>

          <div class="planner-summary-grid" id="planner-summary"></div>

          <div class="planner-columns">
            <article class="planner-list-card">
              <div class="planner-list-head">
                <h3>Cardio Plan</h3>
                <span id="planner-cardio-total">₹0</span>
              </div>
              <div class="planner-items" id="planner-cardio-items"></div>
            </article>

            <article class="planner-list-card">
              <div class="planner-list-head">
                <h3>Strength Plan</h3>
                <span id="planner-strength-total">₹0</span>
              </div>
              <div class="planner-items" id="planner-strength-items"></div>
            </article>
          </div>

        </section>
      </main>

      <footer class="site-footer">
        <img src="assets/cult-equipment-logo.png" alt="cult equipment" />
      </footer>
    </div>

    <script src="budget-planner.js?v=20260707-1"></script>
  </body>
</html>
