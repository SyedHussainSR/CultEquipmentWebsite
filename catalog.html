<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cult equipment Catalog | Filtered Equipment Catalogue</title>
    <meta
      name="description"
      content="Browse the improved cult equipment catalogue with cleaner filters, series views, and product-by-product equipment cards."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="catalog-page">
    <div class="page-shell">
      <header class="site-header is-scrolled">
        <a class="brand" href="index.html" aria-label="cult equipment">
          <img src="assets/cult-equipment-logo.png" alt="cult equipment" />
        </a>
        <nav class="nav-links" aria-label="Primary navigation">
          <a href="index.html#collections">Collections</a>
          <a href="index.html#packages">Packages</a>
          <a href="index.html#owners">Projects</a>
          <a href="catalog.html">Catalog</a>
        </nav>
        <a class="nav-cta" href="index.html#lead-form-wrap">Request a call</a>
      </header>

      <main class="test-page-main">
        <div class="test-page-shell">
          <section class="catalog-title-strip">
            <h1>Catalog</h1>
          </section>

          <section class="test-filter-shell">
            <div class="test-filter-row" aria-label="Catalogue filters">
              <details class="test-filter-dropdown">
                <summary>Cardio</summary>
                <div class="test-filter-menu">
                  <button type="button" data-filter-type="group" data-filter-group="cardio">All Cardio</button>
                  <button type="button" data-filter-type="subcategory" data-filter-group="cardio" data-filter-value="treadmills">Treadmills</button>
                  <button type="button" data-filter-type="subcategory" data-filter-group="cardio" data-filter-value="ellipticals">Ellipticals</button>
                  <button type="button" data-filter-type="subcategory" data-filter-group="cardio" data-filter-value="upright-bikes">Upright Bikes</button>
                  <button type="button" data-filter-type="subcategory" data-filter-group="cardio" data-filter-value="recumbent-bikes">Recumbent Bikes</button>
                  <button type="button" data-filter-type="subcategory" data-filter-group="cardio" data-filter-value="spinning-bikes">Spinning Bikes</button>
                  <button type="button" data-filter-type="subcategory" data-filter-group="cardio" data-filter-value="high-intensity">High Intensity</button>
                </div>
              </details>

              <details class="test-filter-dropdown">
                <summary>Strength</summary>
                <div class="test-filter-menu">
                  <button type="button" data-filter-type="group" data-filter-group="strength">All Strength</button>
                  <button type="button" data-filter-type="subcategory" data-filter-group="strength" data-filter-value="selectorized-series">Selectorized Series</button>
                  <button type="button" data-filter-type="subcategory" data-filter-group="strength" data-filter-value="plate-loaded-series">Plate Loaded Series</button>
                  <button type="button" data-filter-type="subcategory" data-filter-group="strength" data-filter-value="racks-stations">Racks + Stations</button>
                  <button type="button" data-filter-type="subcategory" data-filter-group="strength" data-filter-value="functional-training">Functional Training</button>
                </div>
              </details>

              <details class="test-filter-dropdown">
                <summary>Series</summary>
                <div class="test-filter-menu">
                  <button type="button" data-filter-type="group" data-filter-group="series">All Series</button>
                  <button type="button" data-filter-type="series" data-filter-group="series" data-filter-value="fusion-series">Fusion Series</button>
                  <button type="button" data-filter-type="series" data-filter-group="series" data-filter-value="flow-series">Flow Series</button>
                  <button type="button" data-filter-type="series" data-filter-group="series" data-filter-value="flux-series">Flux Series</button>
                  <button type="button" data-filter-type="series" data-filter-group="series" data-filter-value="fuel-series">Fuel Series</button>
                  <button type="button" data-filter-type="series" data-filter-group="series" data-filter-value="force-series">Force Series</button>
                </div>
              </details>
            </div>

            <div class="test-filter-meta">
              <p id="test-results-label">Showing all catalogue items</p>
              <button class="button ghost" id="test-clear-filters" type="button" hidden>Clear Filters</button>
            </div>
          </section>

          <section class="test-results-shell">
            <div class="test-results-grid" id="test-results"></div>
          </section>
        </div>
      </main>

      <footer class="site-footer">
        <img src="assets/cult-equipment-logo.png" alt="cult equipment" />
      </footer>
    </div>

    <script src="test.js"></script>
  </body>
</html>
